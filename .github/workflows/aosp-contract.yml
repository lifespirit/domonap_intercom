name: AOSP protocol contract

on:
  push:
    branches:
      - aosp-tablet-architecture
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install protocol dependency
        run: python -m pip install --disable-pip-version-check aiohttp
      - name: Compile integration
        run: python -m compileall -q custom_components/domonap test
      - name: Run AOSP contract tests
        run: python -m unittest discover -s test -p 'test_aosp_*.py' -v
